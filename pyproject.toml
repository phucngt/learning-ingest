[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "learning-ingest"
version = "0.1.0"
description = "Chuyển recording đào tạo (video, slide, giáo trình) thành điểm kiến thức có nguồn, chờ HCNS rà soát."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - internal use only" }
dependencies = [
    "pypdf>=4.0",
    "PyYAML>=6.0",
    "jsonschema>=4.18",
]

[project.optional-dependencies]
# Chép lời khi chưa có phụ đề. Kéo theo ctranslate2 và PyAV (đọc MP4 trực tiếp).
asr = ["faster-whisper>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
learning-ingest = "learning_ingest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
learning_ingest = ["schemas/*.json", "prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
